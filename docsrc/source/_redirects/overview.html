<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <!--
      The overview used to live here. It is now the landing page, so this file
      exists only to keep the old URL working for anything that already links to
      it -- a bookmark, a paper, a slide.

      A zero-delay meta refresh is what GitHub Pages allows: it serves static
      files and cannot issue a 301. Search engines treat this as a permanent
      redirect. The target is relative so it works on both nlp-unibo.github.io
      and nlp.unibo.it without either host name being written down.
    -->
    <meta http-equiv="refresh" content="0; url=./">
    <title>Cinnamon — this page has moved</title>
  </head>
  <body>
    <p>
      The overview is now the front page of the documentation.
      <a href="./">Continue to the documentation</a>.
    </p>
  </body>
</html>
