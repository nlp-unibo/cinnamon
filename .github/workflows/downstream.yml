# The check that 2.1.2 did not have.
#
# 2.1.2 shipped on 557 passing tests at 100% branch coverage and broke
# pyhighlights in 49 of them: `forget_loaded_modules` dropped every module
# below a scanned root, the caller's own imports included, so a second
# `Registry.build` handed back a second copy of every class. Coverage measures
# lines, not *arrangements*, and the arrangement that breaks -- a caller
# importing from a directory it then scans -- is not one this project builds
# for itself. No test here could have caught it.
#
# CONTRIBUTING.md asks for this run before a release is tagged. That rule was
# written down only after it had already cost a release, and a rule someone
# has to remember is not a check, so it runs on its own.
name: Downstream

on:
  pull_request:
    branches: ["main"]
    # Source changes and version bumps. A docs-only or workflow-only PR cannot
    # change what a build does to the interpreter, and installing torch to
    # prove that spends several minutes per push.
    paths:
      - "cinnamon/**"
      - "pyproject.toml"
      # And itself, so a change to this file is checked by running it. Without
      # this line the workflow could not run on the pull request that added
      # it, which is a check that has never executed.
      - ".github/workflows/downstream.yml"
  workflow_dispatch:

concurrency:
  group: downstream-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pyhighlights:
    name: pyhighlights' suite against this branch
    runs-on: ubuntu-latest
    steps:
      # Not `cinnamon`: the checkout root has no `__init__.py`, so a directory
      # of that name beside the job's working directory is importable as a
      # namespace package and shadows the installed one. `cinnamon.__file__`
      # then reads `None` and the suite runs against a package that is neither
      # the branch nor the release.
      - name: Check out cinnamon
        uses: actions/checkout@v7
        with:
          path: cinnamon-branch
      - name: Check out pyhighlights
        uses: actions/checkout@v7
        with:
          repository: nlp-unibo/pyhighlights
          path: pyhighlights
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      # pyhighlights first, which pulls the *released* cinnamon-core, and this
      # branch second, over the top of it. The other order lets the sync put
      # the release back and the job passes against the wrong library.
      - name: Install pyhighlights
        run: pip install -e "./pyhighlights[dev]"
      - name: Install cinnamon from this branch
        run: pip install -e ./cinnamon-branch
      # `__path__` rather than `__file__`, which is `None` for a namespace
      # package and so raises instead of reporting. And an equality against the
      # checkout rather than a "not in site-packages" test, which passes for
      # anything importable that is not the wheel.
      - name: Confirm the branch is what is installed
        working-directory: pyhighlights
        run: |
          python - <<'PY'
          import cinnamon, os, sys
          from importlib.metadata import version
          found = [os.path.realpath(entry) for entry in cinnamon.__path__]
          want = os.path.realpath(
              os.path.join(os.environ["GITHUB_WORKSPACE"], "cinnamon-branch", "cinnamon")
          )
          print(f"cinnamon-core {version('cinnamon-core')} at {found}")
          if want not in found:
              sys.exit(f"the branch at {want} is not what imports")
          PY
      # A failure here is a release that must not be tagged, whatever this
      # repository's own suite says. It is deliberately not in ci.yml's
      # `all-green`: that job treats a skipped dependency as a failure, and
      # this one is skipped on every docs-only pull request.
      - name: Run pyhighlights' suite
        working-directory: pyhighlights
        run: pytest -q -n auto
