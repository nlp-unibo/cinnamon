name: Deploy Sphinx documentation to GitHub Pages

on:
  push:
    branches: ["main"] # Triggers when you push to main
  workflow_dispatch:   # Allows you to run it manually from the Actions tab

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Must match the `docs` job in ci.yml. They diverged once: this workflow
      # installed the package without the `cli` extra, so autodoc could not
      # import cinnamon.cli, and the build -- which treats warnings as errors --
      # failed only here, after the pull request had already gone green.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cli]
          pip install sphinx sphinx_autodoc_typehints sphinx_rtd_theme

      - name: Build HTML
        run: |
          cd docsrc
          bash build_docs.sh

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The build output itself. Nothing is committed: the generated site
          # lives only in the artifact this step uploads.
          path: docsrc/build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4