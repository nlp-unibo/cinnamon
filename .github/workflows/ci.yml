name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cli,dev]
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: mypy
        run: mypy cinnamon

  test-core:
    name: Test core (no CLI extra)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      # Confirms the library imports and works without InquirerPy installed.
      # Coverage is not gated here: cli.py and inquirer.py cannot run without
      # the CLI extra, so a whole-package percentage would be meaningless.
      - name: Run core tests
        run: |
          pytest --no-cov \
            --ignore=tests/test_cli.py \
            --ignore=tests/test_inquirer.py

  test-full:
    name: Test full suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cli,dev]
      # The 100% target is reachable on every interpreter: the only
      # version-dependent code (the itertools.batched shim) is excluded via
      # pragma, since its two arms can never both run on one version.
      - name: Run tests with coverage gate
        run: pytest --cov-fail-under=100 --cov-report=term-missing
