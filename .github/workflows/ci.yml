name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-core:
    name: Test Core (no CLI deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Run core tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest --cov-fail-under=100 -k "not cli and not inquirer"
          else
            pytest -k "not cli and not inquirer"
          fi

  test-cli:
    name: Test CLI (with InquirerPy)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CLI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[cli,dev]
      - name: Run CLI tests
        run: |
          pytest -k "cli or inquirer" tests/test_cli.py tests/test_inquirer.py